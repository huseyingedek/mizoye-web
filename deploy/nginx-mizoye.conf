# Mizoye — Nginx sunucu bloğu (statik site)
# Kopyala: sudo cp deploy/nginx-mizoye.conf /etc/nginx/sites-available/mizoye
# Etkinleştir: sudo ln -s /etc/nginx/sites-available/mizoye /etc/nginx/sites-enabled/
# Test + yükle: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Alan adın varsa buraya yaz (ör. mizoye.com www.mizoye.com).
    # Sadece IP ile erişeceksen "_" bırakabilirsin.
    server_name _;

    root /var/www/mizoye;
    index index.html;

    # trailingSlash: true olduğu için sayfalar /klasor/index.html biçiminde
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;

    # Next.js statik varlıkları uzun süre önbelleklensin (parmak izli dosyalar)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Genel statik varlık önbelleği
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
